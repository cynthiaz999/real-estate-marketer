[theme]
primaryColor = "#2F6B4F"             # Buttons and accents (forest green)
backgroundColor = "#F8F9FA"          # Soft light-grey page background
secondaryBackgroundColor = "#EEF2F7" # Sidebar and input fields
textColor = "#1A1D20"                # Deep slate text
font = "sans serif"
baseRadius = "full"                  # Pill-shaped buttons. Try "large" for softly rounded rectangles
 
