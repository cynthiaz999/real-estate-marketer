[theme]
primaryColor = "#2F6B4F"             # Forest green from the logo: buttons, links, focus rings
backgroundColor = "#EDF5F0"          # Mint page background (matches the banner)
secondaryBackgroundColor = "#FFFFFF" # Inputs and widgets sit on white
textColor = "#1F2D26"                # Deep green-slate body text
font = "sans serif"
baseRadius = "large"                 # Soft corners on inputs; primary buttons are made pill-shaped in app.py

[theme.sidebar]
backgroundColor = "#E3EEE7"          # A shade deeper than the page so the sidebar reads as its own panel
secondaryBackgroundColor = "#FFFFFF"
